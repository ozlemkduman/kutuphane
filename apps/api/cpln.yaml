kind: gvc
name: kutuphane-api
spec:
  staticPlacement:
    locationLinks:
      - //location/aws-eu-central-1
---
kind: workload
name: api
spec:
  type: serverless
  containers:
    - name: api
      cpu: "0.25"
      memory: 256Mi
      port: 3001
      env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: "3001"
      readinessProbe:
        httpGet:
          path: /api/health
          port: 3001
        initialDelaySeconds: 10
        periodSeconds: 15
      livenessProbe:
        httpGet:
          path: /api/health
          port: 3001
        initialDelaySeconds: 15
        periodSeconds: 30
  defaultOptions:
    capacityAI: true
    autoscaling:
      minScale: 0
      maxScale: 3
      metric: concurrency
      target: 50
      scaleToZeroDelay: 300
  firewallConfig:
    external:
      inboundAllowCIDR:
        - 0.0.0.0/0
